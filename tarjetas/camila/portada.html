<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bienvenido - Edición Esmeralda</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js via CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      /* ===== ESTILOS GLOBALES ===== */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Poppins', sans-serif;
        overflow: hidden;
        background: #022c22; /* Fondo oscuro esmeralda profundo */
      }

      /* ===== ANIMACIONES ===== */

      /* Partículas flotantes esmeralda/doradas */
      @keyframes particleDrift {
        0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
      }
      .particle { animation: particleDrift linear infinite; }

      /* Gradiente animado en tonos verde esmeralda y oro */
      @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      .animated-gradient {
        background-size: 300% 300%;
        animation: gradientShift 6s ease infinite;
      }

      /* Borde con brillo dorado / esmeralda pulsante */
      @keyframes borderGlow {
        0%, 100% {
          box-shadow: 0 0 20px rgba(16, 185, 129, 0.3),
                      0 0 40px rgba(212, 175, 55, 0.2),
                      inset 0 0 20px rgba(16, 185, 129, 0.1);
        }
        50% {
          box-shadow: 0 0 40px rgba(16, 185, 129, 0.6),
                      0 0 80px rgba(212, 175, 55, 0.4),
                      inset 0 0 40px rgba(16, 185, 129, 0.2);
        }
      }
      .border-glow { animation: borderGlow 3s ease-in-out infinite; }

      /* Shimmer effect */
      @keyframes shimmer {
        0% { transform: translateX(-100%) rotate(25deg); }
        100% { transform: translateX(200%) rotate(25deg); }
      }
      .shimmer { position: relative; overflow: hidden; }
      .shimmer::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 50%;
        height: 200%;
        background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent);
        animation: shimmer 3.5s infinite;
      }

      /* Texto con brillo */
      @keyframes textGlow {
        0%, 100% {
          text-shadow: 0 0 10px rgba(255,255,255,0.6),
                       0 0 20px rgba(16, 185, 129, 0.5);
        }
        50% {
          text-shadow: 0 0 20px rgba(255,255,255,0.9),
                       0 0 40px rgba(212, 175, 55, 0.7),
                       0 0 60px rgba(16, 185, 129, 0.5);
        }
      }
      .text-glow { animation: textGlow 2s ease-in-out infinite; }

      /* Flecha bounce */
      @keyframes arrowBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(12px); }
      }

      /* Rotación lenta */
      @keyframes slowRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Pulso de escala */
      @keyframes pulseScale {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      /* Hover interactivo */
      .interactive-hover {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .interactive-hover:hover {
        transform: scale(1.02);
        filter: brightness(1.1);
      }
      .interactive-hover:active {
        transform: scale(0.98);
      }
    </style>

    <!-- Configuración de Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              poppins: ['Poppins', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>

  <body>
    <!-- ===== CONTENIDO PRINCIPAL CON ALPINE.JS ===== -->
    <div
      x-data="{ showModal: true, isHovered: false }"
      class="min-h-screen w-full bg-emerald-950 flex items-center justify-center overflow-hidden relative"
    >

      <!-- Fondo animado con gradiente esmeralda y toques oscuros -->
      <div class="absolute inset-0 animated-gradient bg-gradient-to-br from-emerald-950 via-gray-950 to-teal-950"></div>

      <!-- Partículas flotantes de fondo (Esmeralda y Rubí/Dorado) -->
      <div class="absolute rounded-full particle" style="left:5%;width:8px;height:8px;background:radial-gradient(circle,rgba(16,185,129,0.7),rgba(212,175,55,0.3));animation-delay:0s;animation-duration:8s;"></div>
      <div class="absolute rounded-full particle" style="left:15%;width:6px;height:6px;background:radial-gradient(circle,rgba(16,185,129,0.5),rgba(225,29,72,0.2));animation-delay:1s;animation-duration:10s;"></div>
      <div class="absolute rounded-full particle" style="left:25%;width:10px;height:10px;background:radial-gradient(circle,rgba(212,175,55,0.6),rgba(16,185,129,0.3));animation-delay:2s;animation-duration:7s;"></div>
      <div class="absolute rounded-full particle" style="left:35%;width:5px;height:5px;background:radial-gradient(circle,rgba(16,185,129,0.4),rgba(225,29,72,0.2));animation-delay:3s;animation-duration:12s;"></div>
      <div class="absolute rounded-full particle" style="left:45%;width:12px;height:12px;background:radial-gradient(circle,rgba(16,185,129,0.6),rgba(212,175,55,0.3));animation-delay:0.5s;animation-duration:9s;"></div>
      <div class="absolute rounded-full particle" style="left:55%;width:7px;height:7px;background:radial-gradient(circle,rgba(225,29,72,0.5),rgba(16,185,129,0.2));animation-delay:4s;animation-duration:11s;"></div>
      <div class="absolute rounded-full particle" style="left:65%;width:9px;height:9px;background:radial-gradient(circle,rgba(16,185,129,0.6),rgba(212,175,55,0.3));animation-delay:1.5s;animation-duration:8s;"></div>
      <div class="absolute rounded-full particle" style="left:75%;width:6px;height:6px;background:radial-gradient(circle,rgba(212,175,55,0.7),rgba(16,185,129,0.2));animation-delay:2.5s;animation-duration:10s;"></div>
      <div class="absolute rounded-full particle" style="left:85%;width:11px;height:11px;background:radial-gradient(circle,rgba(16,185,129,0.5),rgba(225,29,72,0.3));animation-delay:3.5s;animation-duration:7s;"></div>
      <div class="absolute rounded-full particle" style="left:92%;width:8px;height:8px;background:radial-gradient(circle,rgba(212,175,55,0.6),rgba(16,185,129,0.2));animation-delay:5s;animation-duration:13s;"></div>

      <!-- Anillo decorativo rotatorio grande (Estilo Joyería) -->
      <div class="absolute w-[600px] h-[600px] md:w-[800px] md:h-[800px] rounded-full border border-emerald-500/20" style="animation: slowRotate 30s linear infinite;">
        <div class="absolute top-0 left-1/2 w-3 h-3 bg-emerald-400 rounded-full -translate-x-1/2 -translate-y-1/2 shadow-lg shadow-emerald-400/50"></div>
        <div class="absolute bottom-0 left-1/2 w-2 h-2 bg-amber-400 rounded-full -translate-x-1/2 translate-y-1/2 shadow-lg shadow-amber-400/50"></div>
      </div>

      <!-- Segundo anillo rotatorio -->
      <div class="absolute w-[400px] h-[400px] md:w-[600px] md:h-[600px] rounded-full border border-amber-500/15" style="animation: slowRotate 20s linear infinite reverse;">
        <div class="absolute top-1/2 right-0 w-2 h-2 bg-rose-400 rounded-full translate-x-1/2 -translate-y-1/2 shadow-lg shadow-rose-400/50"></div>
      </div>

      <!-- ===== MODAL PRINCIPAL ===== -->
      <div
        x-show="showModal"
        x-transition:enter="transition ease-out duration-700"
        x-transition:enter-start="opacity-0 scale-75"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-500"
        x-transition:leave-start="opacity-100 scale-100"
        x-transition:leave-end="opacity-0 scale-50"
        class="relative z-50 cursor-pointer interactive-hover"
        x-on:click="window.open('https://test-camila.my.canva.site/mi-invitacion ', '_self')"
        x-on:mouseenter="isHovered = true"
        x-on:mouseleave="isHovered = false"
        role="button"
        tabindex="0"
        aria-label="Ir al sitio - Haz clic aquí"
      >
        <!-- Contenedor del modal con proporción vertical móvil -->
        <div class="relative w-[85vw] max-w-[400px] h-[85vh] max-h-[750px] rounded-3xl overflow-hidden border-glow shimmer border border-amber-400/40">

          <!-- Imagen de fondo temática (Esmeralda / Lujo) -->
          <div
            class="absolute inset-0 bg-cover bg-center bg-no-repeat transition-transform duration-700"
            x-bind:class="isHovered ? 'scale-110' : 'scale-100'"
            style="background-image: url('cam5c.jpg')"
          ></div>

          <!-- Overlay con gradiente esmeralda oscuro -->
          <div class="absolute inset-0 bg-gradient-to-t from-emerald-950/90 via-emerald-900/40 to-transparent animated-gradient"></div>

          <!-- Efecto hover overlay dorado/esmeralda -->
          <div
            class="absolute inset-0 bg-gradient-to-t from-emerald-600/40 to-transparent transition-opacity duration-500"
            x-bind:class="isHovered ? 'opacity-100' : 'opacity-0'"
          ></div>

          <!-- Borde brillante -->
          <div
            class="absolute inset-0 rounded-3xl border-2 transition-all duration-500"
            x-bind:class="isHovered ? 'border-amber-400/70' : 'border-emerald-500/30'"
          ></div>

          <!-- Contenido del modal -->
          <div class="relative z-10 flex flex-col items-center justify-between h-full p-6 md:p-8">

            <!-- Parte superior - Icono / Joya -->
            <div
              x-show="showModal"
              x-transition:enter="transition ease-out duration-1000 delay-300"
              x-transition:enter-start="opacity-0 -translate-y-10"
              x-transition:enter-end="opacity-100 translate-y-0"
              class="mt-8"
            >
              <div
                class="w-16 h-16 md:w-20 md:h-20 rounded-2xl bg-white backdrop-blur-md border border-amber-400/40 flex items-center justify-center shadow-xl overflow-hidden transition-all duration-500"
                x-bind:class="isHovered ? 'rotate-12 scale-110' : ''"
              >
                <!-- Tu imagen local en la raíz -->
                <img 
                  src="icono.png" 
                  alt="Icono personalizado" 
                  class="w-full h-full object-cover"
                />
              </div>
            </div>

            <!-- Parte central - Texto -->
            <div class="flex flex-col items-center text-center space-y-4">
              <div
                x-show="showModal"
                x-transition:enter="transition ease-out duration-1000 delay-500"
                x-transition:enter-start="opacity-0 translate-y-8"
                x-transition:enter-end="opacity-100 translate-y-0"
              >
                <h1 class="text-3xl md:text-4xl font-bold text-white text-glow leading-tight">
                  ¡Mis Quince Años!
                </h1>
              </div>

              <div
                x-show="showModal"
                x-transition:enter="transition ease-out duration-1000 delay-700"
                x-transition:enter-start="opacity-0 translate-y-8"
                x-transition:enter-end="opacity-100 translate-y-0"
              >
                <p class="text-emerald-100/90 text-sm md:text-base font-light max-w-[250px]">
                  Con agrado te invito a celebrar conmigo este día tan especial para mi. 
                </p>
              </div>

              <!-- Badge de interacción -->
              <div
                x-show="showModal"
                x-transition:enter="transition ease-out duration-1000 delay-1000"
                x-transition:enter-start="opacity-0 scale-50"
                x-transition:enter-end="opacity-100 scale-100"
                class="mt-4"
              >
                <div
                  class="px-6 py-3 rounded-full backdrop-blur-md border transition-all duration-500"
                  x-bind:class="isHovered ? 'bg-emerald-600/40 border-amber-400/80 shadow-lg shadow-emerald-500/40' : 'bg-emerald-950/40 border-emerald-500/30'"
                >
                  <span class="text-white text-sm font-medium flex items-center gap-2">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-amber-400"></span>
                    </span>
                    Haz clic aquí
                  </span>
                </div>
              </div>
            </div>

            <!-- Parte inferior - Flecha animada -->
            <div
              x-show="showModal"
              x-transition:enter="transition ease-out duration-1000 delay-1200"
              x-transition:enter-start="opacity-0 translate-y-10"
              x-transition:enter-end="opacity-100 translate-y-0"
              class="mb-4 flex flex-col items-center"
            >
              <div class="relative">
                <div class="absolute w-10 h-10 rounded-full bg-emerald-400/20 animate-ping" style="top:-5px;left:-5px;"></div>
                <div class="w-8 h-8 rounded-full bg-emerald-900/60 border border-amber-400/30 backdrop-blur-sm flex items-center justify-center" style="animation: arrowBounce 1.5s ease-in-out infinite;">
                  <svg class="w-4 h-4 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
                  </svg>
                </div>
              </div>
              <p class="text-emerald-200/60 text-xs mt-3 font-light tracking-wider uppercase">
                Desliza para ver la invitación
              </p>
            </div>
          </div>

          <!-- Efecto de ondas al hover -->
          <div
            class="absolute inset-0 pointer-events-none overflow-hidden rounded-3xl transition-opacity duration-500"
            x-bind:class="isHovered ? 'opacity-100' : 'opacity-0'"
          >
            <div class="absolute top-1/4 left-1/4 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl" style="animation: pulseScale 3s ease-in-out infinite;"></div>
            <div class="absolute bottom-1/3 right-1/4 w-24 h-24 bg-amber-500/10 rounded-full blur-2xl" style="animation: pulseScale 4s ease-in-out infinite 1s;"></div>
          </div>
        </div>
      </div>

      <!-- Esquinas decorativas -->
      <div class="fixed top-4 left-4 w-16 h-16 border-l-2 border-t-2 border-emerald-500/40 rounded-tl-lg"></div>
      <div class="fixed top-4 right-4 w-16 h-16 border-r-2 border-t-2 border-emerald-500/40 rounded-tr-lg"></div>
      <div class="fixed bottom-4 left-4 w-16 h-16 border-l-2 border-b-2 border-emerald-500/40 rounded-bl-lg"></div>
      <div class="fixed bottom-4 right-4 w-16 h-16 border-r-2 border-b-2 border-emerald-500/40 rounded-br-lg"></div>
    </div>

    <!-- Div oculto para que Vite no falle en build -->
    <div id="root" style="display:none;"></div>
  </body>
</html>
